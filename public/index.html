<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>scittle-split</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
      h1 { font-size: 1.4rem; }
      ul { list-style: none; padding: 0; }
      li { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
      li span { flex: 1; }
      .done { text-decoration: line-through; opacity: .5; }
      .new { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; }
      .del { border: 0; background: none; cursor: pointer; font-size: 1.1rem; opacity: .4; }
      .del:hover { opacity: 1; }
      .count, .local { color: #666; font-size: .85rem; }
    </style>
  </head>
  <body>
    <div id="app"><!--ssr--></div>
    <!-- Grabs the server-rendered nodes before Scittle runs. If Reagami adopts
         them, these are the same objects afterwards. -->
    <script>window.ssrProbe = {root: document.querySelector('#app > div'),
                               li: document.querySelector('#app li')};</script>

    <script src="https://cdn.jsdelivr.net/npm/scittle@0.8.32/dist/scittle.js"></script>
    <!-- Reagami has no dependencies and no macros, so Scittle can evaluate the
         source straight from the repo. No React, no build, no bundle. -->
    <script type="application/x-scittle"
            src="https://raw.githubusercontent.com/borkdude/reagami/v0.2.40/src/reagami/core.cljc"></script>
    <script type="application/x-scittle" src="/client.cljs"></script>
  </body>
</html>
