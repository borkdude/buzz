name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A render lane per connection is a virtual thread, so the JVM side needs
      # 21 or later. See doc/ai/adr/0008-a-render-lane-per-connection.md.
      # Babashka carries its own runtime and does not need this.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
          cli: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # A macro reaching a private var is legal under SCI and fatal on the JVM,
      # so the same tests run on both.
      - run: bb test

      - run: clojure -M:test
