name: test

on:
  push:
    # request-mark while the redesign is watched for flaky hangs
    branches: [main, request-mark]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
          cli: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      # A macro reaching a private var is legal under SCI and fatal on the JVM,
      # so the same tests run on both.
      - run: bb test

      - run: clojure -M:test
