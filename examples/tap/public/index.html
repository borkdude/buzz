<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>taps</title>
    <style nonce="NONCE">
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.3rem; margin-bottom: .25rem; }
      code, .preview { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .hint, .count, .said { color: #666; font-size: .85rem; }
      .samples button { font: inherit; margin-right: .4rem; }
      .entries { list-style: none; padding: 0; }
      .entries > li { border-top: 1px solid #eee; padding: .35rem 0; }
      .head { display: flex; align-items: baseline; gap: .5rem; }
      .head .preview { flex: 1; font-size: .85rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { color: #999; font-size: .8rem; }
      .toggle, .copy { font: inherit; border: 0; background: none; cursor: pointer; color: #666; }
      .toggle { width: 1.5rem; }
      .tree { display: block; padding: .25rem 0 .5rem 1.5rem;
              --font-size: .85rem; --background-color: transparent;
              --property-color: #7a3e9d; --string-color: #0a7d3e; --number-color: #b35c00; }
    </style>
  </head>
  <body>
    <div id="app"><!--app--></div>
    <!-- The tree is a web component. Its script comes from the same host the
         page already loads Squint and Reagami from, and it styles itself with
         constructable stylesheets rather than a style tag, so the policy the
         page arrives with needs no widening. -->
    <script type="module" nonce="NONCE" src="https://esm.sh/@alenaksu/json-viewer@2.1.2"></script>
    <script type="importmap" nonce="NONCE">
      {"imports": {"squint-cljs/core.js": "https://esm.sh/squint-cljs@0.14.208/core.js"}}
    </script>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
