<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>taps</title>
    <style nonce="NONCE">
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.3rem; margin-bottom: .25rem; }
      code, .row, .preview { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .hint, .said { color: #666; font-size: .85rem; }
      .credit { font-size: .8rem; }
      .credit a { color: #999; }
      .samples button { font: inherit; margin-right: .4rem; }
      .entries { list-style: none; padding: 0; }
      .entries > li { border-top: 1px solid #eee; padding: .35rem 0; }
      .head { display: flex; align-items: baseline; gap: .5rem; }
      .head .preview { flex: 1; font-size: .85rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { color: #999; font-size: .8rem; }
      .toggle, .select, .copy, .fold, .more { font: inherit; border: 0; background: none; cursor: pointer; color: #666; }
      .more { padding: 0; text-decoration: underline dotted; }
      .toggle { width: 1.5rem; }
      .tree { padding: .25rem 0 .5rem; font-size: .85rem; }
      .row { display: flex; gap: .35rem; }
      .row.sel { background: #fff3bf; }
      .row .select, .row .copy { visibility: hidden; padding: 0; font-size: .8rem; }
      .row:hover .select, .row:hover .copy { visibility: visible; }
      .fold { width: 1rem; padding: 0; text-align: left; }
      .k, .t-kw { color: #7a3e9d; }
      .t-str { color: #0a7d3e; }
      .t-num { color: #b35c00; }
      .t-nil, .t-bool { color: #999; }
      .t-more { color: #bbb; }
      .t-range { color: #999; }
      .kids { margin-left: 1rem; }
      .cls { color: #999; font-size: .78rem; }
      .view { font: inherit; border: 0; background: none; cursor: pointer; color: #666; font-size: .8rem; padding: 0; text-decoration: underline dotted; }
      .tbl { border-collapse: collapse; margin: .25rem 0 .5rem 1rem; }
      .tbl th, .tbl td { border: 1px solid #eee; padding: .1rem .35rem; text-align: left; vertical-align: top; }
      .tbl th { color: #7a3e9d; font-weight: normal; }
      .tbl .rk { color: #999; }
      .err { margin: .25rem 0 .5rem 1rem; border-left: 2px solid #d33; padding-left: .5rem; }
      .err-msg { color: #b00; }
      .err-trace { margin: .2rem 0; padding-left: 1.2rem; color: #666; font-size: .78rem; }
      .err-more { color: #999; font-size: .78rem; }
      .icon { width: .85em; height: .85em; vertical-align: -.1em; }
      .eval { margin: .75rem 0 .25rem; }
      .expr { font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; width: 100%; box-sizing: border-box; padding: .25rem .4rem; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <div id="app"><!--app--></div>
    <script type="importmap" nonce="NONCE">
      {"imports": {"squint-cljs/core.js": "SQUINT_CORE"}}
    </script>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
